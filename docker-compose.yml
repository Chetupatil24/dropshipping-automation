version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dropship_postgres
    environment:
      POSTGRES_DB: dropshipping_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dropship_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dropship_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dropship_network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dropship_backend
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    networks:
      - dropship_network
    restart: unless-stopped

  # Background Job Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dropship_worker
    command: node backend/jobs/worker.js
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app/backend
    networks:
      - dropship_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  dropship_network:
    driver: bridge
