# Google Cloud Build - CI/CD pipeline for Ruthan Dropshipping
# Triggered on push to main branch.
# Builds the backend Docker image, pushes to Artifact Registry,
# and deploys to Cloud Run.
#
# Setup: gcloud builds triggers create github \
#   --repo-name=<YOUR_REPO> \
#   --repo-owner=<YOUR_GITHUB_ORG> \
#   --branch-pattern=^main$ \
#   --build-config=cloudbuild.yaml

substitutions:
  _REGION: asia-south1
  _SERVICE_NAME: ruthan-backend-api
  _IMAGE: asia-south1-docker.pkg.dev/$PROJECT_ID/ruthan/$_SERVICE_NAME

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}:${SHORT_SHA}'
      - '-t'
      - '${_IMAGE}:latest'
      - '.'
    id: 'docker-build'

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_IMAGE}'
    id: 'docker-push'
    waitFor: ['docker-build']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_IMAGE}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--concurrency=80'
      - '--timeout=60'
    id: 'cloud-run-deploy'
    waitFor: ['docker-push']

images:
  - '${_IMAGE}:${SHORT_SHA}'
  - '${_IMAGE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
